name: sentinelops-testlab

services:
  llm-chat:
    image: sentinelops-backend:local
    command: ["/app/.venv/bin/uvicorn", "app:app", "--app-dir", "/chat", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      AI_KEY_FILE: /run/secrets/llm_key
      CHAT_RECORDS_FILE: /data/records.jsonl
      CHAT_DATABASE_FILE: /data/chat.sqlite3
      PYTHONDONTWRITEBYTECODE: "1"
    ports: ["127.0.0.1:18081:8080"]
    volumes:
      - ./testlab/llm_chat:/chat:ro
      - ./.local/llm-chat:/data
    secrets: [llm_key]
    read_only: true
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      platform:
        aliases: [testlab-llm-chat]

secrets:
  llm_key:
    file: ./.local/ai-secrets/deepseek.key

networks:
  platform:
    external: true
    name: sentinelops_default
